name: test

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Only one pending revision per PR/branch; never interrupt an executing test.
# Draft PR events have no runner job. Ready promotes the actual owning Go test.
concurrency:
  group: keycli-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    # A Draft PR is not an accepted test candidate; do not enqueue a hosted job.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
      - name: Verify (Linux)
        env:
          CGO_ENABLED: "0"
        run: ./verify.sh --suite all
