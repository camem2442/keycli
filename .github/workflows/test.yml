name: KeyCLI no-queue verification

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Owner reviewed same-repository PR number"
        required: true
        type: string
      reviewed_head:
        description: "Reviewed exact PR HEAD SHA"
        required: true
        type: string
      admitted_isolated_vm:
        description: "Independent ephemeral VM and runner admission"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: keycli-pr-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  isolated-source:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'camem2442/keycli' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'camem2442' &&
      github.triggering_actor == 'camem2442' &&
      inputs.admitted_isolated_vm == true
    runs-on: [self-hosted, Linux, ARM64, keycli-ephemeral-vm]
    timeout-minutes: 20
    steps:
      - name: Check dedicated VM environment before public source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          test "$(id -u)" -ne 0
          case "$RUNNER_NAME" in keycli-ephemeral-vm-*) ;; *) exit 2;; esac
          for cmd in git python3 bash go gofmt rg; do command -v "$cmd" >/dev/null; done
          test -d /opt/keycli-go-modcache
          test ! -w /opt/keycli-go-modcache
      - name: Checkout reviewed SHA (no persistent GitHub token)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.reviewed_head }}
          path: source
          persist-credentials: false
          clean: false
          fetch-depth: 1
      - name: Verify PR original before and after scoped Go test
        shell: bash
        env:
          PR: ${{ inputs.pr_number }}
          HEAD: ${{ inputs.reviewed_head }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import json, os, re, subprocess
          from urllib.request import Request, urlopen
          n, sha = os.environ['PR'], os.environ['HEAD']
          if not re.fullmatch(r'[1-9][0-9]{0,5}', n) or not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('HOLD: invalid source identity')
          def check():
              req = Request('https://api.github.com/repos/camem2442/keycli/pulls/'+n,
                            headers={'User-Agent':'keycli-owner-g2'})
              with urlopen(req, timeout=15) as r:
                  raw = r.read(1024*1024+1)
              if len(raw)>1024*1024:
                  raise SystemExit('HOLD: oversized metadata')
              p=json.loads(raw)
              if (p.get('number')!=int(n) or p.get('state')!='open'
                  or p.get('draft') is not False
                  or p.get('user',{}).get('login')!='camem2442'
                  or p.get('head',{}).get('sha')!=sha
                  or p.get('head',{}).get('repo',{}).get('full_name')!='camem2442/keycli'
                  or p.get('base',{}).get('ref')!='main'):
                  raise SystemExit('HOLD: PR review identity changed')
          check()
          if subprocess.check_output(['git','-C','source','rev-parse','HEAD'],text=True).strip()!=sha:
              raise SystemExit('HOLD: checkout mismatch')
          if subprocess.check_output(['git','-C','source','status','--porcelain'],text=True).strip():
              raise SystemExit('HOLD: dirty source')
          env = {k:v for k,v in os.environ.items()
                 if k in ('PATH','HOME','LANG','LC_ALL','TMPDIR','GOROOT','GOPATH','GOCACHE')}
          env.update({'CGO_ENABLED':'0','GOWORK':'off','GOTOOLCHAIN':'local',
                      'GOPROXY':'off','GOFLAGS':'-mod=readonly',
                      'GOMODCACHE':'/opt/keycli-go-modcache'})
          for suite in ('docs','policy','unit'):
              code=subprocess.run(['bash','verify.sh','--suite',suite],
                                  cwd='source',env=env,check=False).returncode
              if code: raise SystemExit(code)
          check()
          if subprocess.check_output(['git','-C','source','status','--porcelain'],text=True).strip():
              raise SystemExit('HOLD: source drift')
          print('SCOPED_SOURCE_PASS; no release, Mac Keychain or provider qualification')
          PY
