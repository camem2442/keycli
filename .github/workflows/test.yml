name: test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # Same-repository events only: fork PR code never reaches the resident Flip3 runner.
    # A skipped job is NOT a pass.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Flip3 self-hosted ARM64 (hosted allowance exhausted). No hosted fallback.
    # Needs a keycli-registered Flip3 runner carrying these labels; until then the job queues.
    runs-on: [self-hosted, Linux, ARM64, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Require preinstalled ripgrep (no in-job install)
        run: command -v rg >/dev/null
      - name: Verify (Linux)
        env:
          CGO_ENABLED: "0"
        run: ./verify.sh --suite all
