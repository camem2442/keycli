name: test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # Trusted owner and same-repository PR only. A skipped job is never a PASS.
    if: >-
      github.repository == 'camem2442/keycli' &&
      github.actor == 'camem2442' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.user.login == 'camem2442' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    # KeyCLI's *dedicated* repository-scoped Flip3 runner; no hosted fallback.
    runs-on: [self-hosted, Linux, ARM64, android]
    timeout-minutes: 30
    steps:
      - name: Require admitted exact KeyCLI runner before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "camem2442/keycli"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "ARM64"
          test "$RUNNER_NAME" = "flip3-a14-kc"
          test "$(uname -m)" = "aarch64"
          test "$(id -u)" -ne 0
          # Only the trusted runner-started hook creates this 0600 lease receipt.
          # Do not read/output its contents (the device lease may be sensitive).
          lease="${RUNNER_TEMP}/.flip3-device-lease-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          python3 -I -B - "$lease" <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys
          p=Path(sys.argv[1])
          info=p.lstat()
          assert stat.S_ISREG(info.st_mode) and not p.is_symlink()
          assert info.st_uid==os.getuid() and (info.st_mode & 0o077)==0
          assert info.st_size>0
          print("PRECHECK_KEYCLI_DEDICATED_RUNNER_LIVE_LEASE_PRESENT")
          PY
      - name: Checkout exact event source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout identity and preinstalled Go toolchain
        shell: bash
        env:
          EXPECT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECT_HEAD"
          test -z "$(git status --porcelain=v1)"
          command -v rg >/dev/null
          command -v go >/dev/null
          python3 -I -B - <<'PY'
          import re
          import subprocess
          v=subprocess.run(["go","version"],capture_output=True,text=True,check=True,timeout=6).stdout.strip()
          m=re.search(r"go1\.(\d+)(?:\.(\d+))?",v)
          assert m and int(m.group(1))>=22, "Go >= 1.22 preinstalled toolchain required"
          print("PRECHECK_KEYCLI_PINNED_SOURCE_AND_GO_READY")
          PY
      - name: Verify Linux Go, docs, backend, release smoke
        env:
          CGO_ENABLED: "0"
        run: ./verify.sh --suite all
