name: test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
      - name: Verify (Linux)
        env:
          CGO_ENABLED: "0"
        run: ./verify.sh --suite all
