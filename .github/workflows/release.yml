name: KeyCLI private operational candidate
run-name: keycli-operational-${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Unique label of the admitted one-job KeyCLI Runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    if: >-
      github.repository == 'camem2442/keycli-release-validation' &&
      github.event.repository.visibility == 'private' &&
      github.ref == 'refs/heads/codex/g4b-private-producer-352e12d' &&
      startsWith(inputs.runner, 'keycli-g4b-')
    runs-on: [self-hosted, Linux, ARM64, "${{ inputs.runner }}"]
    timeout-minutes: 30
    env:
      RELEASE_VERSION: v0.10.0
      SOURCE_SHA: 352e12d72a3fc7189e7a4049c5643ce1d593d41e
      SOURCE_TREE: 59ef8ed34d55585cc5285651637f2d480e8049fe
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      RELEASE_CHANNEL: operational
      RUNNER_MODE: utm-ci
      TAG_OBJECT: ""
    steps:
      - name: Check isolated guest prerequisites
        run: |
          set -euo pipefail
          test "$(uname -sm)" = "Linux aarch64"
          test "$(id -u):$(id -g)" = "1001:1001"
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          test ! -w /opt/keycli-go-modcache
          podman image exists sha256:3394b74b17b9b3cb6f3ce8ac19ad7df001fb6d473990e403435a255bf81059bd
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 352e12d72a3fc7189e7a4049c5643ce1d593d41e
          path: source
          persist-credentials: false
      - name: Build and gate one operational bundle
        run: bash release-control/scripts/private-operational-candidate.sh
      - name: Upload gated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets-${{ github.run_attempt }}
          path: candidate/*
          if-no-files-found: error
