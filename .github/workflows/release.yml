name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, or intended final version for an operational candidate"
        required: true
        type: string
      dry_run:
        description: "Verify and build only; dev/rc publication requires false"
        type: boolean
        default: true
      candidate_channel:
        description: "Select operational only for a private candidate"
        type: choice
        options:
          - tagged
          - operational
        default: tagged
      candidate_source_sha:
        description: "Reviewed 40-character source SHA for an operational candidate"
        type: string
      candidate_approval_ref:
        description: "Approval record for the exact operational candidate"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
  WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.classify.outputs.version }}
      source_sha: ${{ steps.classify.outputs.source_sha }}
      tag_object: ${{ steps.classify.outputs.tag_object }}
      channel: ${{ steps.classify.outputs.channel }}
      approval_ref: ${{ steps.classify.outputs.approval_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Select one release source
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          CANDIDATE_CHANNEL: ${{ inputs.candidate_channel }}
          SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          APPROVAL_REF: ${{ inputs.candidate_approval_ref }}
        run: bash scripts/release-contract.sh classify

  guard:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - name: Hold stable publication pending independent acceptance
        env:
          RELEASE_CHANNEL: ${{ needs.classify.outputs.channel }}
        run: |
          set -euo pipefail
          case "$RELEASE_CHANNEL" in
            dev|rc|operational) ;;
            stable) echo "::error::stable release requires PR-14 operational acceptance and explicit publication approval"; exit 3 ;;
            *) echo "::error::missing or unknown release channel"; exit 3 ;;
          esac

  verify:
    needs: [classify, guard]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    env:
      RELEASE_VERSION: ${{ needs.classify.outputs.version }}
      SOURCE_SHA: ${{ needs.classify.outputs.source_sha }}
      TAG_OBJECT: ${{ needs.classify.outputs.tag_object }}
      RELEASE_CHANNEL: ${{ needs.classify.outputs.channel }}
      APPROVAL_REF: ${{ needs.classify.outputs.approval_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Bind checkout and release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../release-control/scripts/release-contract.sh bind
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Unit and policy regression
        env:
          CGO_ENABLED: "0"
        run: bash verify.sh --suite all

  build:
    needs: [classify, verify]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    env:
      RELEASE_VERSION: ${{ needs.classify.outputs.version }}
      SOURCE_SHA: ${{ needs.classify.outputs.source_sha }}
      TAG_OBJECT: ${{ needs.classify.outputs.tag_object }}
      RELEASE_CHANNEL: ${{ needs.classify.outputs.channel }}
      APPROVAL_REF: ${{ needs.classify.outputs.approval_ref }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha: ${{ steps.build.outputs.manifest_sha }}
      run_attempt: ${{ steps.build.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Bind checkout and release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../release-control/scripts/release-contract.sh bind
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Build the selected source once
        id: build
        run: |
          set -euo pipefail
          rm -rf dist
          KC_VERSION="$RELEASE_VERSION" KC_COMMIT="$SOURCE_SHA" KC_BUILD_CHANNEL="$RELEASE_CHANNEL" \
            bash scripts/lifecycle.sh release
          bash ../release-control/scripts/release-contract.sh provenance > dist/provenance.json
          (cd dist && sha256sum provenance.json >> SHA256SUMS)
          echo "manifest_sha=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: release-assets-${{ github.run_attempt }}
          path: source/dist/*
          if-no-files-found: error

  gate:
    needs: [classify, build]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: source
    env:
      RELEASE_VERSION: ${{ needs.classify.outputs.version }}
      SOURCE_SHA: ${{ needs.classify.outputs.source_sha }}
      TAG_OBJECT: ${{ needs.classify.outputs.tag_object }}
      RELEASE_CHANNEL: ${{ needs.classify.outputs.channel }}
      APPROVAL_REF: ${{ needs.classify.outputs.approval_ref }}
      BUILD_RUN_ATTEMPT: ${{ needs.build.outputs.run_attempt }}
      MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Bind checkout and release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../release-control/scripts/release-contract.sh bind
      - name: Require the exact uploaded artifact ID
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: source/dist
          merge-multiple: true
      - name: Verify the complete artifact bundle
        run: bash ../release-control/scripts/release-contract.sh verify-bundle
      - name: Check the downloaded Linux binaries
        env:
          ARCH: ${{ matrix.arch }}
        run: bash ../release-control/scripts/release-contract.sh verify-binary "$ARCH"

  publish:
    needs: [classify, verify, build, gate]
    if: ${{ (needs.classify.outputs.channel == 'dev' || needs.classify.outputs.channel == 'rc') && (github.event_name == 'push' || inputs.dry_run == false) }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.classify.outputs.version }}
      SOURCE_SHA: ${{ needs.classify.outputs.source_sha }}
      TAG_OBJECT: ${{ needs.classify.outputs.tag_object }}
      RELEASE_CHANNEL: ${{ needs.classify.outputs.channel }}
      APPROVAL_REF: ${{ needs.classify.outputs.approval_ref }}
      MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify the gated manifest before publication
        run: |
          set -euo pipefail
          cd dist
          [[ "$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" == "$MANIFEST_SHA" ]]
          sha256sum --strict -c SHA256SUMS
      - name: Attest the prerelease assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Recheck the tag and publish the verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="refs/tags/$RELEASE_VERSION"
          matches="$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            ls-remote --exit-code "$REPOSITORY_URL" "$ref" "$ref^{}")"
          object="$(awk -v ref="$ref" '$2 == ref { print $1 }' <<<"$matches")"
          peeled="$(awk -v ref="$ref^{}" '$2 == ref { print $1 }' <<<"$matches")"
          [[ "$object" == "$TAG_OBJECT" && "${peeled:-$object}" == "$SOURCE_SHA" ]] || {
            echo "::error::release tag moved since classification"
            exit 1
          }
          gh release create "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "$RELEASE_VERSION ($RELEASE_CHANNEL)" \
            --notes "Source: $SOURCE_SHA. Provider effects are locked. Operational acceptance: HOLD." \
            dist/*
