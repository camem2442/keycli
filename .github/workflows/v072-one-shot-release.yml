name: v0.7.2 one-shot gated release

on:
  push:
    branches: [main]
    paths:
      - "docs/planning/v072-release-candidate.md"

permissions:
  contents: read

concurrency:
  group: keycli-v072-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'camem2442/keycli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Ensure dependencies
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
          command -v gh
          command -v python3
          command -v sha256sum
      - name: Refuse a pre-existing v0.7.2 tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fqx 'release_tag: v0.7.2' docs/planning/v072-release-candidate.md
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.7.2" >/dev/null 2>&1; then
            echo "v0.7.2 tag already exists: refusing overwrite" >&2
            exit 1
          fi
          if gh release view v0.7.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.7.2 release already exists: refusing overwrite" >&2
            exit 1
          fi
      - name: Verify exact main source
        env:
          CGO_ENABLED: "0"
        run: ./verify.sh --suite all
      - name: Build pinned release artifacts and check integrity
        env:
          CGO_ENABLED: "0"
          KC_VERSION: v0.7.2
        run: |
          set -euo pipefail
          export KC_COMMIT="$(git rev-parse --short HEAD)"
          bash scripts/lifecycle.sh release
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6
          bash scripts/verify-mcp-binary.sh "$PWD/dist/kc-linux-amd64" v0.7.2
          TEMP_INSTALL="$(mktemp -d)"
          trap 'rm -rf "$TEMP_INSTALL"' EXIT
          install -m 755 dist/kc-linux-amd64 "$TEMP_INSTALL/kc"
          cmp dist/kc-linux-amd64 "$TEMP_INSTALL/kc"
          bash scripts/verify-mcp-binary.sh "$TEMP_INSTALL/kc" v0.7.2
      - name: Publish v0.7.2 from exactly this checked source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.7.2 \
            dist/kc-darwin-arm64 \
            dist/kc-darwin-amd64 \
            dist/kc-linux-amd64 \
            dist/kc-linux-arm64 \
            dist/keycli-linux-amd64 \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v0.7.2 — MCP safe defaults" \
            --notes-file docs/planning/v072-release-notes.md
          gh release view v0.7.2 --repo "$GITHUB_REPOSITORY" --json tagName,assets,isDraft,isPrerelease \
            --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, asset_names: [.assets[].name]}'
      - name: Download published assets and exercise actual release installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUBLISHED="$RUNNER_TEMP/keycli-v072-published"
          INSTALLED="$RUNNER_TEMP/keycli-v072-installed"
          mkdir -p "$PUBLISHED" "$INSTALLED"
          fetched=0
          for attempt in 1 2 3; do
            if gh release download v0.7.2 --repo "$GITHUB_REPOSITORY" --dir "$PUBLISHED"; then
              fetched=1
              break
            fi
            rm -f "$PUBLISHED"/*
            sleep 3
          done
          test "$fetched" -eq 1
          test "$(find "$PUBLISHED" -maxdepth 1 -type f | wc -l)" -eq 6
          (cd "$PUBLISHED" && sha256sum -c SHA256SUMS)
          cmp dist/kc-linux-amd64 "$PUBLISHED/kc-linux-amd64"
          install -m 755 "$PUBLISHED/kc-linux-amd64" "$INSTALLED/kc"
          bash scripts/verify-mcp-binary.sh "$INSTALLED/kc" v0.7.2
          echo "published-download-install: v0.7.2 verified at exact release asset bytes"
